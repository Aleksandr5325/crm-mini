services:
  crm-postgres:
    image: postgres:18.6-bookworm
    container_name: crm-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always
  
  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: crm-env-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:crm-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"