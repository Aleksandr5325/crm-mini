  /CRM_mini/hs/crm/report:
    get:
      summary: GetAllData
      responses:
        '200':
          description: 200 - Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  period:
                    type: object
                    properties:
                      from:
                        type: string
                      to:
                        type: string
                  funnel:
                    type: object
                    properties:
                      NewPercent:
                        type: integer
                      QualifiedPercent:
                        type: number
                      ProposalPercent:
                        type: integer
                      WonPercent:
                        type: integer
                      LostPercent:
                        type: integer
                  kpi:
                    type: object
                    properties:
                      NewToQualified:
                        type: integer
                      NewToLost:
                        type: integer
                      QualifiedToProposal:
                        type: integer
                      QualifiedToLost:
                        type: integer
                      ProposalToWon:
                        type: number
                      ProposalToLost:
                        type: number
                  avgtime:
                    type: object
                    properties:
                      new:
                        type: number
                      qualified:
                        type: number
                      proposal:
                        type: number
              example:
                period:
                  from: '2023-10-25T14:30:00'
                  to: '2026-10-25T14:30:00'
                funnel:
                  NewPercent: 100
                  QualifiedPercent: 80.5
                  ProposalPercent: 69
                  WonPercent: 29
                  LostPercent: 20
                kpi:
                  NewToQualified: 100
                  NewToLost: 0
                  QualifiedToProposal: 100
                  QualifiedToLost: 0
                  ProposalToWon: 59.184
                  ProposalToLost: 40.816
                avgtime:
                  new: 46.6
                  qualified: 50.6
                  proposal: 48.1
        '400':
          description: 400 - Bad Request
          headers:
            Server:
              schema:
                type: string
              example: Microsoft-IIS/10.0
            X-Powered-By:
              schema:
                type: string
              example: ASP.NET
            Date:
              schema:
                type: string
              example: Thu, 09 Apr 2026 07:56:13 GMT
            Content-Length:
              schema:
                type: integer
              example: 76
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
              example:
                error: INVALID_REQUEST
                message: Invalid date format for End.
      tags:
        - Report
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                start:
                  type: string
                end:
                  type: string
            example:
              start: '2023-10-25T14:30:00'
              end: '2026-10-25T14:30:00'
  /CRM_mini/hs/crm/auth/register:
    post:
      summary: Register
      responses:
        '400':
          description: 400 - Invalid Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
              example:
                error: INVALID_REQUEST
                message: role is required
        '409':
          description: 409 - Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
              example:
                error: CONFLICT
                message: Пользователь с таким email уже существует
      tags:
        - Register
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                email:
                  type: string
                role:
                  type: string
                password:
                  type: string
                  format: utc-millisec
            example:
              full_name: Админ
              email: аdmin@f.ru
              role: admin
              password: '1'
  /CRM_mini/hs/crm/auth/login:
    post:
      summary: Login
      responses:
        '400':
          description: 400 - Invalid Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
              example:
                error: INVALID_REQUEST
                message: password is required
        '401':
          description: 401 - Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
              example:
                error: UNAUTHORIZED
                message: Неверный пароль
      tags:
        - Login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
            example:
              email: login@login.ru
              password: ''
  /CRM_mini/hs/crm/import:
    post:
      summary: Import
      parameters:
        - name: token
          in: header
          required: false
          deprecated: false
          schema: {}
          example: ddeec265-3ab6-4e50-a70d-d976eb07f613
      responses: {}
      tags:
        - Import
  /CRM_mini/hs/crm/export:
    post:
      summary: Export
      parameters:
        - name: token
          in: header
          required: false
          deprecated: false
          schema: {}
          example: 927df129-bad8-45c2-8223-84d39b9d0ec2
      responses: {}
      tags:
        - Export
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example: "{\r\n    \"resource_type\": \"leads\",  // или \"lead_stages\"\r\n    \"manager\": \"elena.petrova@company.ru\",\r\n    \"catalog\": \"C:/Удалить\"\r\n}\r\n"
