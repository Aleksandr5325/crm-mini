<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM — Воронка продаж</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header__brand">
      <span class="app-header__logo">CRM</span>
      <span class="app-header__title">Воронка продаж</span>
    </div>

    <nav class="app-nav" id="appNav">
      <a class="app-nav__link" href="#/import" data-route="import">Импорт CSV</a>
      <a class="app-nav__link" href="#/leads"  data-route="leads">Лиды</a>
      <a class="app-nav__link" href="#/kanban" data-route="kanban">Воронка</a>
      <a class="app-nav__link" href="#/report" data-route="report">Отчёт</a>
    </nav>

    <div class="role-switcher" id="roleSwitcher" role="group" aria-label="Выбор роли">
      <button type="button" class="role-switcher__btn" data-role="viewer">Пользователь</button>
      <button type="button" class="role-switcher__btn" data-role="worker">Работник</button>
      <button type="button" class="role-switcher__btn" data-role="manager">Менеджер</button>
    </div>
  </header>

  <main class="app-main" id="appMain">
    <!-- Сюда роутер рендерит активный экран -->
  </main>

  <!-- Шаблон карточки сделки (модалка) -->
  <div class="modal" id="dealModal" hidden>
    <div class="modal__backdrop" data-modal-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="dealModalTitle">
      <div class="modal__header">
        <h2 class="modal__title" id="dealModalTitle">Карточка сделки</h2>
        <button class="modal__close" type="button" data-modal-close aria-label="Закрыть">×</button>
      </div>
      <div class="modal__body" id="dealModalBody">
        <!-- Заполняется dealView.js -->
      </div>
      <div class="modal__footer" id="dealModalFooter">
        <!-- Кнопки появляются в зависимости от роли -->
      </div>
    </div>
  </div>

  <!-- Глобальный тост-контейнер -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
